<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Desk — Offline PDF toolkit</title>
<meta name="description" content="Merge, convert, compress and lock PDFs — entirely on your computer. No uploads, no accounts, no tracking.">
<meta name="theme-color" content="#00AEEF">
<meta property="og:title" content="Paper Desk — Offline PDF toolkit">
<meta property="og:description" content="18 PDF tools that run entirely on your computer. Nothing is uploaded.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2300AEEF'/%3E%3Cpath d='M7 4h7l4 4v12a1 1 0 01-1 1H7a1 1 0 01-1-1V5a1 1 0 011-1z' fill='white'/%3E%3C/svg%3E">
<style>
/* =========================================================================
   Paper Desk — landing page
   Process-ink identity: Organise cyan · Convert magenta · Optimise yellow · Secure ink.
   ========================================================================= */
:root{
  --cyan:#00AEEF; --cyan-ink:#0076A6;
  --magenta:#EC008C; --magenta-ink:#BC0070;
  --yellow:#FFD400; --yellow-ink:#7A5E00;
  --accent:var(--cyan);
  --font-latin:'Sora',system-ui,sans-serif;
  --font-ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --font:var(--font-latin);
  --maxw:1200px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="light"]{
  --bg:#F4F6F9; --bg-2:#ECEFF4; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --text:#0E1016; --muted:#566074; --faint:#8A93A6; --line:#E2E7EE; --line-2:#CFD6E0;
  --shadow:20,30,60; --hero-1:#E8FBFF; --hero-2:#F4F6F9;
  --glass:rgba(255,255,255,.72); --glass-brd:rgba(255,255,255,.9);
}
:root[data-theme="dark"]{
  --bg:#080A10; --bg-2:#0C0F17; --surface:#11151F; --surface-2:#161B27;
  --text:#EEF1F7; --muted:#A3ACC0; --faint:#6B7489; --line:#222838; --line-2:#333B50;
  --shadow:0,0,0; --hero-1:#06282E; --hero-2:#080A10;
  --accent:#35C4FF; --cyan:#35C4FF; --magenta:#FF4DAE; --yellow:#FFDF4A;
  --glass:rgba(17,21,31,.7); --glass-brd:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 55%,transparent) transparent}
/* slim, branded browser scrollbar (WebKit) */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--magenta));border-radius:100px;border:3px solid var(--bg);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--magenta),var(--cyan));background-clip:padding-box;border:2px solid var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;
  transition:background .5s var(--ease-out),color .5s var(--ease-out);-webkit-font-smoothing:antialiased}
[dir="rtl"] body{font-family:var(--font-ar)}
a{color:inherit;text-decoration:none}
img,svg,canvas{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
section{position:relative}

/* custom cursor (desktop, fine pointer only) */
@media (hover:hover) and (pointer:fine){
  .cur-dot,.cur-ring{position:fixed;top:0;left:0;z-index:999;pointer-events:none;border-radius:50%;mix-blend-mode:normal}
  .cur-dot,.cur-ring{opacity:0;transition:opacity .2s}
  body.cur-ready .cur-dot,body.cur-ready .cur-ring{opacity:1}
  body.cur-hide .cur-dot,body.cur-hide .cur-ring{opacity:0!important}
  body.cur-on.cur-hide,body.cur-on.cur-hide *{cursor:auto!important}
  .cur-dot{width:7px;height:7px;background:var(--accent);transform:translate(-50%,-50%)}
  .cur-ring{width:34px;height:34px;border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);transform:translate(-50%,-50%);
    transition:width .25s var(--ease-spring),height .25s var(--ease-spring),border-color .25s,opacity .3s}
  .cur-ring.hot{width:52px;height:52px;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  body.cur-on,body.cur-on *{cursor:none!important}
}
@media (prefers-reduced-motion:reduce){ .cur-dot,.cur-ring{display:none!important} body.cur-on,body.cur-on *{cursor:auto!important} }

/* scroll progress bar */
.scrollbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:100;
  background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--yellow));transition:width .1s linear}

/* ===================== reveal ===================== */
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease-out),transform 1s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal.fade-l{transform:translateX(-40px)} .reveal.fade-l.in{transform:none}
.reveal.fade-r{transform:translateX(40px)} .reveal.fade-r.in{transform:none}
.reveal.zoom{transform:scale(.92)} .reveal.zoom.in{transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}
.reveal.d4{transition-delay:.32s}.reveal.d5{transition-delay:.40s}.reveal.d6{transition-delay:.48s}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1!important;transform:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ===================== nav ===================== */
.nav{position:fixed;inset:0 0 auto 0;z-index:90;display:flex;align-items:center;justify-content:center;
  padding:14px 24px;background:transparent;transition:background .4s,backdrop-filter .4s,border-color .4s,padding .4s;border-bottom:1px solid transparent}
.nav.scrolled{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line);padding:10px 24px}
.nav-inner{width:100%;max-width:var(--maxw);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;cursor:pointer}
.brand .mark{width:34px;height:34px;flex:none}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a{padding:8px 14px;border-radius:100px;font-size:14px;font-weight:500;color:var(--muted);transition:color .2s,background .2s}
.nav-links a:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nav-ctl{display:flex;align-items:center;gap:8px}
.chip-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:100px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;
  transition:transform .2s var(--ease-spring),border-color .2s,background .2s,color .2s}
.chip-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip-btn svg{width:17px;height:17px}
.icon-btn{width:38px;padding:0}

/* language toggle — tiny, tidy single pill that flips EN ⇄ ع */
.lang{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:100px;cursor:pointer;user-select:none;
  border:1px solid var(--line-2);background:var(--surface);color:var(--text);
  transition:border-color .2s,background .2s,transform .2s var(--ease-out),box-shadow .2s}
.lang:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line-2));background:var(--surface-2);transform:translateY(-1px);
  box-shadow:0 6px 16px -10px color-mix(in srgb,var(--accent) 60%,transparent)}
.lang:active{transform:translateY(0)}
.lang .globe{width:17px;height:17px;flex:none;color:var(--muted);transition:color .2s,transform .5s var(--ease-out)}
.lang:hover .globe{color:var(--accent);transform:rotate(28deg)}
.lang .code{font-weight:700;line-height:1;min-width:15px;text-align:center}
.lang .code.en{font-family:var(--font-latin);font-size:13px;letter-spacing:.02em}
.lang .code.ar{font-family:var(--font-ar);font-size:16px}

/* ===================== primary button ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding:0 28px;border-radius:16px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:16px;border:none;position:relative;overflow:hidden;isolation:isolate;
  background:var(--text);color:var(--bg);transition:transform .3s var(--ease-spring),box-shadow .3s;box-shadow:0 10px 30px -10px rgba(var(--shadow),.5)}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;transform:translateX(-101%);background:linear-gradient(120deg,var(--cyan),var(--magenta));transition:transform .5s var(--ease-out)}
[dir="rtl"] .btn::before{transform:translateX(101%)}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px -12px color-mix(in srgb,var(--accent) 60%,transparent);color:#fff}
.btn:hover::before{transform:translateX(0)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost::before{display:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sub{font-size:12px;font-weight:500;opacity:.7;margin-top:-2px}
.btn-col{flex-direction:column;gap:0;line-height:1.2}

/* ===================== hero ===================== */
.hero{padding:150px 0 90px;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(1200px 700px at 72% 18%,var(--hero-1),transparent 60%);pointer-events:none}
#spark{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;opacity:.85}
.hero .wrap{position:relative;z-index:2}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 14px 0 10px;border-radius:100px;
  background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  font-size:13px;font-weight:600;color:var(--cyan-ink);margin-bottom:22px}
:root[data-theme="dark"] .badge{color:var(--accent)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#0B8F5F;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(11,143,95,.5)}70%{box-shadow:0 0 0 7px rgba(11,143,95,0)}100%{box-shadow:0 0 0 0 rgba(11,143,95,0)}}
h1.title{font-size:clamp(34px,5.6vw,66px);line-height:1.1;letter-spacing:-.035em;font-weight:800;margin-bottom:22px}
[dir="rtl"] h1.title{line-height:1.4;letter-spacing:0}
.title i{font-style:italic;color:var(--accent)}
.title .ink{position:relative;display:inline;background-image:linear-gradient(120deg,var(--cyan),var(--magenta));background-repeat:no-repeat;
  background-position:0 100%;background-size:0% 8%;animation:inkline 1s .5s var(--ease-out) forwards;padding-bottom:3px}
@keyframes inkline{to{background-size:100% 8%}}
/* Arabic: keep the gradient underline but drop it into a padding gap below the
   glyphs (clear of descenders) and the generous line-height keeps it off the next line's harakat */
[dir="rtl"] .title .ink{display:inline-block;position:relative;background:none;-webkit-text-fill-color:currentColor;color:inherit;
  padding-bottom:.18em;animation:none}
[dir="rtl"] .title .ink::after{content:'';position:absolute;right:1%;left:1%;bottom:.05em;height:.08em;border-radius:6px;
  background:linear-gradient(120deg,var(--cyan),var(--magenta));transform:scaleX(0);transform-origin:right;animation:inkbar .9s .5s var(--ease-out) forwards}
@keyframes inkbar{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){[dir="rtl"] .title .ink::after{transform:scaleX(1);animation:none}}
@media (prefers-reduced-motion:reduce){.title .ink{animation:none;background-size:100% 8%}}
.hero-lead{font-size:clamp(16px,2.1vw,19px);color:var(--muted);max-width:520px;margin-bottom:30px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hero-facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px}
.fact{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--muted)}
.fact svg{width:18px;height:18px;color:#0B8F5F;flex:none}
:root[data-theme="dark"] .fact svg{color:#45D69A}

/* rating chip */
.rating{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:8px 14px;border-radius:100px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px -14px rgba(var(--shadow),.5)}
.stars{display:flex;gap:2px}
.stars svg{width:15px;height:15px;color:#FFB400}
.rating b{font-weight:700;font-size:14px}
.rating span{font-size:12.5px;color:var(--muted)}

/* ===================== hero visual: 3D device ===================== */
.hero-visual{position:relative;height:460px;perspective:1600px}
.stage{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
/* ---- hero floating window ---- */
.win{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 50px 90px -34px rgba(var(--shadow),.55),0 12px 34px -16px rgba(var(--shadow),.35);transform-style:preserve-3d}
.win-bar{height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.win-bar i{width:11px;height:11px;border-radius:50%;background:var(--line-2)}
.win-bar i:nth-child(1){background:#FF5F57}.win-bar i:nth-child(2){background:#FEBC2E}.win-bar i:nth-child(3){background:#28C840}
.win-body{padding:18px;display:grid;grid-template-columns:94px 1fr;gap:14px;height:calc(100% - 38px)}
/* ---- 3D laptop (download section) ---- */
.dl-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:330px;perspective:1500px}
.dl-glow{position:absolute;width:90%;height:80%;border-radius:50%;filter:blur(62px);opacity:.42;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 32% 36%,var(--cyan),transparent 58%),radial-gradient(circle at 72% 60%,var(--magenta),transparent 58%),radial-gradient(circle at 54% 90%,var(--yellow),transparent 60%)}
.laptop{position:relative;z-index:1;display:block;width:100%;max-width:400px;padding-bottom:13px;text-decoration:none;color:inherit;cursor:pointer;
  transform-style:preserve-3d;will-change:transform;transform:rotateX(4deg)}
.laptop:hover .lid{box-shadow:0 84px 130px -44px rgba(var(--shadow),.72),0 28px 66px -26px rgba(var(--shadow),.52),0 0 0 1.5px color-mix(in srgb,var(--accent) 32%,transparent)}
.lid{position:relative;border-radius:22px 22px 10px 10px;padding:14px 15px 17px;transform-style:preserve-3d;
  background:linear-gradient(158deg,#343943 0%,#1b1e24 52%,#0e1015 100%);
  box-shadow:0 74px 120px -46px rgba(var(--shadow),.72),0 26px 62px -26px rgba(var(--shadow),.5),inset 0 1.5px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.05);
  transition:box-shadow .3s var(--ease-out)}
.cam{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;z-index:6;
  background:radial-gradient(circle at 40% 35%,#4a505b,#14161b);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.screen{position:relative;border-radius:7px;overflow:hidden;background:var(--surface);aspect-ratio:16/10.3;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.screen::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:7px;
  background:linear-gradient(118deg,rgba(255,255,255,.1),transparent 30%)}
.scr-top{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 13px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.scr-top .dots{display:flex;gap:6px}
.scr-top .dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.scr-top .dots i:nth-child(1){background:#FF5F57}.scr-top .dots i:nth-child(2){background:#FEBC2E}.scr-top .dots i:nth-child(3){background:#28C840}
.scr-top .scr-ttl{font-size:11px;font-weight:600;color:var(--faint);margin-inline-start:5px}
/* laptop screen: app home (tool grid) — distinct from the hero window */
/* laptop screen = app's download screen (CTA lives on the screen itself) */
.scr-dl{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.ds-icons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ds-chip{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line)}
.ds-chip svg{width:16px;height:16px}
.ds-chip.c0{background:color-mix(in srgb,var(--cyan) 10%,var(--surface-2))}.ds-chip.c0 svg{color:var(--cyan)}
.ds-chip.c1{background:color-mix(in srgb,var(--magenta) 10%,var(--surface-2))}.ds-chip.c1 svg{color:var(--magenta)}
.ds-chip.c2{background:color-mix(in srgb,var(--yellow) 14%,var(--surface-2))}.ds-chip.c2 svg{color:#C79600}
:root[data-theme="dark"] .ds-chip.c2 svg{color:var(--yellow)}
.ds-mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.ds-mark svg{width:22px;height:22px}
.ds-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:100px;font-weight:700;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--cyan),var(--magenta));box-shadow:0 12px 24px -8px color-mix(in srgb,var(--accent) 65%,transparent);transition:filter .2s,transform .2s var(--ease-out)}
.ds-btn svg{width:16px;height:16px;animation:dsar 1.5s ease-in-out infinite}
@keyframes dsar{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.laptop:hover .ds-btn{filter:brightness(1.07);transform:translateY(-1px)}
.laptop.is-soon .ds-btn{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2);box-shadow:none}
.laptop.is-soon .ds-btn svg{color:var(--muted);animation:none}
.ds-note{font-size:11px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){.ds-btn svg{animation:none}}
/* clean, minimal laptop base — a slim aluminium slab with a finger-groove notch */
.base{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:116%;height:15px;
  clip-path:polygon(3.5% 0,96.5% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,#eef1f6 0%,#cfd5de 48%,#aab2bd 100%);
  box-shadow:0 34px 44px -22px rgba(var(--shadow),.6)}
.base::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24%;height:6px;border-radius:0 0 9px 9px;
  background:linear-gradient(180deg,#99a1ad,#c4cbd4)}
.base::after{content:'';position:absolute;bottom:1.5px;left:9%;right:9%;height:1.5px;border-radius:2px;background:rgba(255,255,255,.55)}
:root[data-theme="dark"] .base{background:linear-gradient(180deg,#474d58 0%,#2a2f39 48%,#15181e 100%)}
:root[data-theme="dark"] .base::before{background:linear-gradient(180deg,#15181e,#2f343e)}
:root[data-theme="dark"] .base::after{background:rgba(255,255,255,.07)}
/* bouncing download badge on the laptop */
.win-rail{display:flex;flex-direction:column;gap:7px}
.rail-item{height:22px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;gap:6px;padding:0 7px}
.rail-item.on{background:color-mix(in srgb,var(--cyan) 16%,transparent)}
.rail-item i{width:11px;height:11px;border-radius:3px;background:var(--line-2);flex:none}
.rail-item.on i{background:var(--cyan)}
.rail-item b{height:5px;border-radius:3px;background:var(--line-2);flex:1}
.rail-item.on b{background:color-mix(in srgb,var(--cyan) 60%,transparent)}
.win-main{background:var(--surface-2);border-radius:12px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.drop-mock{border:1.5px dashed var(--line-2);border-radius:10px;height:74px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--faint);font-size:12px;font-weight:500;transition:border-color .3s,background .3s}
.drop-mock svg{width:22px;height:22px;flex:none;stroke:var(--cyan)}
.row-mock{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:11px}
.row-mock svg{width:15px;height:15px;flex:none;color:var(--faint)}
.row-mock span:not(.pill){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-mock .pill{margin-inline-start:auto;font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px}
.pill.ok{color:#0B8F5F;background:rgba(11,143,95,.12)}

.sheet{position:absolute;width:76px;height:96px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 44px -18px rgba(var(--shadow),.5);overflow:hidden;will-change:transform}

.sheet.s1{top:-26px;left:-38px;transform:translateZ(60px)}.sheet.s1::before{border-color:transparent var(--cyan) transparent transparent}
.sheet.s2{bottom:-30px;left:-18px;transform:translateZ(90px)}.sheet.s2::before{border-color:transparent var(--magenta) transparent transparent}
.sheet.s3{top:46px;right:-42px;transform:translateZ(45px)}.sheet.s3::before{border-color:transparent var(--yellow) transparent transparent}
/* the "download me" cursor hint that bounces toward the button */
.hint{position:absolute;z-index:5;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.hint .bubble{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--magenta));padding:6px 12px;border-radius:100px;white-space:nowrap;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent);animation:bob 1.6s ease-in-out infinite}
.hint .cursor{width:22px;height:22px;color:var(--text);animation:bob 1.6s ease-in-out infinite .1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}.hint .bubble,.hint .cursor{animation:none}}

/* ===================== trust strip ===================== */
.strip{padding:28px 0;border-block:1px solid var(--line);background:var(--surface);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.strip-row{display:flex;white-space:nowrap}
.strip-track{display:flex;gap:46px;padding-inline-end:46px;animation:slide 30s linear infinite}
[dir="rtl"] .strip-track{animation-direction:reverse}
@keyframes slide{to{transform:translateX(-50%)}}
.strip-row .it{display:flex;align-items:center;gap:13px;color:var(--muted);font-weight:600;font-size:14px}
.strip-row .it .sdot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 0%,transparent)}
.sdot.c0{background:var(--cyan)}.sdot.c1{background:var(--magenta)}.sdot.c2{background:var(--yellow)}

/* ===================== section ===================== */
.sec{padding:96px 0}
.sec-head{text-align:center;max-width:680px;margin:0 auto 54px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.sec h2{font-size:clamp(28px,4vw,44px);line-height:1.1;letter-spacing:-.03em;font-weight:800;margin-bottom:16px}
.sec h2 .thin{font-weight:400;color:var(--muted)}
.sec-head p{font-size:17px;color:var(--muted)}

/* ===================== tools ===================== */
.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.cat{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:100px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-family:inherit;font-weight:600;font-size:14px;transition:all .25s var(--ease-out)}
.cat .d{width:8px;height:8px;border-radius:50%}
.cat:hover{color:var(--text);transform:translateY(-2px)}
.cat.on{color:#fff;border-color:transparent}
.cat.on[data-c="all"]{background:var(--text);color:var(--bg)}
.cat.on[data-c="organise"]{background:var(--cyan)}.cat[data-c="organise"] .d{background:var(--cyan)}
.cat.on[data-c="convert"]{background:var(--magenta)}.cat[data-c="convert"] .d{background:var(--magenta)}
.cat.on[data-c="optimise"]{background:var(--yellow);color:#4a3a00}.cat[data-c="optimise"] .d{background:var(--yellow)}
.cat.on[data-c="secure"]{background:var(--text);color:var(--bg)}.cat[data-c="secure"] .d{background:var(--text)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tool{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;overflow:hidden;transition:transform .35s var(--ease-spring),border-color .35s,box-shadow .35s}
.tool::after{content:'';position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 26px 26px 0;border-color:transparent;opacity:0;transition:opacity .3s,border-width .3s var(--ease-spring)}
[dir="rtl"] .tool::after{right:auto;left:0;border-width:0 0 26px 26px}
.tool:hover{transform:translateY(-6px);border-color:var(--line-2);box-shadow:0 24px 46px -22px rgba(var(--shadow),.42)}
.tool:hover::after{opacity:1;border-width:0 34px 34px 0}
[dir="rtl"] .tool:hover::after{border-width:0 0 34px 34px}
.tool[data-c="organise"]:hover::after{border-color:transparent var(--cyan) transparent transparent}
.tool[data-c="convert"]:hover::after{border-color:transparent var(--magenta) transparent transparent}
.tool[data-c="optimise"]:hover::after{border-color:transparent var(--yellow) transparent transparent}
.tool[data-c="secure"]:hover::after{border-color:transparent var(--text) transparent transparent}
[dir="rtl"] .tool[data-c="organise"]:hover::after{border-color:transparent transparent transparent var(--cyan)}
[dir="rtl"] .tool[data-c="convert"]:hover::after{border-color:transparent transparent transparent var(--magenta)}
[dir="rtl"] .tool[data-c="optimise"]:hover::after{border-color:transparent transparent transparent var(--yellow)}
[dir="rtl"] .tool[data-c="secure"]:hover::after{border-color:transparent transparent transparent var(--text)}
.tool .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;transition:transform .35s var(--ease-spring)}
.tool:hover .ico{transform:scale(1.08) rotate(-4deg)}
.tool .ico svg{width:22px;height:22px}

.tool[data-c="convert"] .ico{background:color-mix(in srgb,var(--magenta) 15%,transparent);color:var(--magenta-ink)}
.tool[data-c="optimise"] .ico{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--yellow-ink)}
.tool[data-c="secure"] .ico{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
:root[data-theme="dark"] .tool[data-c="organise"] .ico{color:var(--cyan)}
:root[data-theme="dark"] .tool[data-c="convert"] .ico{color:var(--magenta)}

.tool h3{font-size:16px;font-weight:700;margin-bottom:5px;letter-spacing:-.01em}
.tool p{font-size:13.5px;color:var(--muted);line-height:1.5}
.tool.hide{display:none}

/* ===================== download ===================== */
.download{background:var(--surface);border-block:1px solid var(--line)}

.dl-card .btn-col{max-width:320px;margin:0 auto}

.dl-ver{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 12px;border-radius:100px;margin-bottom:18px}
.dl-card h3{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.dl-card p{color:var(--muted);font-size:15px;margin-bottom:24px}
.dl-meta{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:22px;font-size:12.5px;color:var(--faint)}
.dl-meta b{color:var(--muted);font-weight:600}
.dl-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:50px}
.dl-side{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.step .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--accent)}
.step h4{font-size:15px;font-weight:700;margin-bottom:2px}
.step p{font-size:13.5px;color:var(--muted)}

/* ===================== update banner ===================== */
.update-banner{position:fixed;z-index:95;left:50%;bottom:22px;transform:translate(-50%,140%);display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);
  padding:12px 14px 12px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 20px 50px -16px rgba(var(--shadow),.5);transition:transform .6s var(--ease-spring)}
.update-banner.show{transform:translate(-50%,0)}
.update-banner .ub-ico{width:38px;height:38px;flex:none;border-radius:10px;background:color-mix(in srgb,var(--accent) 15%,transparent);display:flex;align-items:center;justify-content:center;color:var(--accent)}

.update-banner .ub-x{width:30px;height:36px;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:18px}

.btn.is-soon{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2);box-shadow:none;cursor:default}

.btn.is-soon:hover{transform:none;color:var(--muted);box-shadow:none}
.btn.is-soon .btn-sub{opacity:.8}

.toast .t-ico{display:flex;color:var(--accent)}
.toast .t-ico svg{width:19px;height:19px}

.faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.q{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;transition:border-color .3s}

footer{background:var(--surface);border-top:1px solid var(--line);padding:42px 0 26px;position:relative;overflow:hidden}

}

function stripItems(L){ return L.strip.map((s,i)=>`<span class="it"><span class="sdot c${i%3}"></span>${s}</span>`).join(''); }
function catChips(L){ return ['all','organise','convert','optimise','secure'].map((c,i)=>`<button class="cat ${i===0?'on':''}" data-cursor data-c="${c}">${c!=='all'?'<span class="d"></span>':''}${L.cats[c]}</button>`).join(''); }
function toolCards(L){ return TOOLS.map(tl=>{const[cat,ic,nm,ds]=tl;const i=LANG==='ar'?1:0;return `<div class="tool reveal" data-c="${cat}"><div class="ico">${svg(ic)}</div><h3>${nm[i]}</h3><p>${ds[i]}</p></div>`;}).join(''); }

/* ============================ wiring ============================ */
function wireSection(){
  document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const c=b.dataset.c;
    document.querySelectorAll('#toolGrid .tool').forEach(tl=>tl.classList.toggle('hide', c!=='all'&&tl.dataset.c!==c));
  });
  document.querySelectorAll('.q-head').forEach(h=>h.onclick=()=>{
    const q=h.parentElement, body=q.querySelector('.q-body'), open=q.classList.contains('open');
    document.querySelectorAll('.q').forEach(x=>{x.classList.remove('open');x.querySelector('.q-body').style.maxHeight=null;});
    if(!open){q.classList.add('open');body.style.maxHeight=body.scrollHeight+'px';}
  });
  observeReveals(); startSpark(); startDlCols(); wireStageTilt(); refreshCursorTargets();
}

/* ============================ reveal on scroll ============================ */
let revealIO;
function observeReveals(){
  const els=document.querySelectorAll('.reveal:not(.in)');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  if(revealIO) revealIO.disconnect();
  revealIO=new IntersectionObserver(ents=>{
    ents.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); revealIO.unobserve(en.target); } });
  },{rootMargin:'0px 0px -7% 0px',threshold:.12});
  els.forEach(e=>revealIO.observe(e));
}

/* ============================ 3D device tilt + float ============================ */
function tiltStage(hostSel,stageSel,amt){
  const host=$(hostSel), stage=$(stageSel); if(!host||!stage) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ stage.style.transform='none'; return; }
  const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  let tX=0,tY=0,cX=0,cY=0;
  if(fine){
    host.addEventListener('pointermove',e=>{
      const r=host.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
      tX=py*-amt.x; tY=px*amt.y;
    });
    host.addEventListener('pointerleave',()=>{ tX=0; tY=0; });
  }
  const key='_raf'+stageSel;
  cancelAnimationFrame(tiltStage[key]);
  (function loop(now){
    cX+=(tX-cX)*.07; cY+=(tY-cY)*.07;
    const bob=Math.sin(now/1400)*amt.bob;
    stage.style.transform=`translateY(${bob.toFixed(2)}px) rotateX(${cX.toFixed(2)}deg) rotateY(${cY.toFixed(2)}deg)`;
    tiltStage[key]=requestAnimationFrame(loop);
  })(performance.now());
}
function wireStageTilt(){
  tiltStage('#top','#stage',{x:9,y:13,bob:8});
  tiltStage('#download','#dlStage',{x:7,y:11,bob:6});
}

/* ============================ hero spark ============================ */
let sparkRAF;
function startSpark(){
  const c=$('#spark'); if(!c) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx=c.getContext('2d'); let W,H,dots=[],mouse={x:-9999,y:-9999};
  const inks=()=>{const s=getComputedStyle(document.documentElement);return[s.getPropertyValue('--cyan').trim(),s.getPropertyValue('--magenta').trim(),s.getPropertyValue('--yellow').trim()];};
  let COL=inks();
  function size(){const r=c.parentElement.getBoundingClientRect();W=c.width=r.width*devicePixelRatio;H=c.height=r.height*devicePixelRatio;c.style.width=r.width+'px';c.style.height=r.height+'px';
    const n=Math.min(42,Math.floor(r.width/28));
    dots=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.12*devicePixelRatio,vy:(Math.random()-.5)*.12*devicePixelRatio,r:(Math.random()*1.6+.8)*devicePixelRatio,c:COL[Math.floor(Math.random()*3)],a:Math.random()*.4+.15}));}
  size(); addEventListener('resize',size);
  const host=$('#top');
  host.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*devicePixelRatio;mouse.y=(e.clientY-r.top)*devicePixelRatio;});
  host.addEventListener('pointerleave',()=>{mouse.x=mouse.y=-9999;});
  cancelAnimationFrame(sparkRAF);
  (function loop(){
    ctx.clearRect(0,0,W,H);
    for(const d of dots){
      const dx=d.x-mouse.x,dy=d.y-mouse.y,dist=Math.hypot(dx,dy),R=120*devicePixelRatio;
      if(dist<R){const f=(R-dist)/R;d.x+=dx/dist*f*2.4;d.y+=dy/dist*f*2.4;}
      d.x+=d.vx;d.y+=d.vy;
      if(d.x<0||d.x>W)d.vx*=-1; if(d.y<0||d.y>H)d.vy*=-1;
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fillStyle=d.c;ctx.globalAlpha=d.a;ctx.fill();
    }
    ctx.globalAlpha=1; sparkRAF=requestAnimationFrame(loop);
  })();
  startSpark._refresh=()=>{COL=inks();dots.forEach(d=>d.c=COL[Math.floor(Math.random()*3)]);};
}

/* ============================ download card glow ============================ */
let dlRAF;
function startDlCols(){
  const c=$('#dlCols'); if(!c) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx=c.getContext('2d'); let W,H,t0=0;
  function size(){const r=c.getBoundingClientRect();W=c.width=r.width*devicePixelRatio;H=c.height=r.height*devicePixelRatio;}
  size(); addEventListener('resize',size);
  const s=getComputedStyle(document.documentElement);
  const cols=[s.getPropertyValue('--cyan').trim(),s.getPropertyValue('--magenta').trim(),s.getPropertyValue('--yellow').trim()];
  cancelAnimationFrame(dlRAF);
  (function loop(){
    t0+=.006; ctx.clearRect(0,0,W,H); ctx.globalAlpha=.10;
    cols.forEach((col,i)=>{const x=W*(.25+.2*Math.sin(t0+i*2)),y=H*(.3+.3*Math.cos(t0*.8+i*1.7)),rad=Math.min(W,H)*.5;
      const g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);});
    ctx.globalAlpha=1; dlRAF=requestAnimationFrame(loop);
  })();
}

/* ============================ custom cursor ============================ */
function initCursor(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.body.classList.add('cur-on');
  const dot=$('#curDot'), ring=$('#curRing');
  let mx=0,my=0,rxp=0,ryp=0;
  addEventListener('pointermove',e=>{
    mx=e.clientX;my=e.clientY;
    // hide the custom cursor over the native scrollbar gutter (right edge)
    const overBar = (innerWidth - e.clientX) <= (innerWidth - document.documentElement.clientWidth) + 2;
    document.body.classList.toggle('cur-hide', overBar);
    dot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`;
    if(!document.body.classList.contains('cur-ready'))document.body.classList.add('cur-ready');
  },{passive:true});
  document.addEventListener('mouseleave',()=>document.body.classList.add('cur-hide'));
  document.addEventListener('mouseenter',()=>document.body.classList.remove('cur-hide'));
  (function loop(){rxp+=(mx-rxp)*.18;ryp+=(my-ryp)*.18;ring.style.transform=`translate(${rxp}px,${ryp}px) translate(-50%,-50%)`;requestAnimationFrame(loop);})();
  window.refreshCursorTargets=()=>{
    document.querySelectorAll('[data-cursor]').forEach(el=>{
      if(el._curBound) return; el._curBound=1;
      el.addEventListener('pointerenter',()=>ring.classList.add('hot'));
      el.addEventListener('pointerleave',()=>ring.classList.remove('hot'));
    });
  };
  refreshCursorTargets();
}
window.refreshCursorTargets=window.refreshCursorTargets||function(){};

/* ============================ language + theme ============================ */
function applyLang(){
  const L=t();
  document.documentElement.lang=LANG; document.documentElement.dir=L.dir;
  document.documentElement.style.setProperty('--font',L.font);
  localStorage.setItem('pd_lang',LANG);
  renderLang();
  buildApp();
}
function globeIcon(){ return '<svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.7 2.5 4.1 5.6 4.1 9s-1.4 6.5-4.1 9c-2.7-2.5-4.1-5.6-4.1-9S9.3 5.5 12 3z"/></svg>'; }
function renderLang(){
  const el=$('#lang'); if(!el) return;
  const code = LANG==='en' ? '<span class="code en">EN</span>' : '<span class="code ar">ع</span>';
  el.innerHTML = globeIcon()+code;
  el.setAttribute('aria-label', LANG==='en'?'التبديل إلى العربية':'Switch to English');
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',THEME);
  localStorage.setItem('pd_theme',THEME);
  $('#themeBtn').innerHTML = THEME==='dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>';
  document.querySelector('meta[name=theme-color]').setAttribute('content',getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
  if(startSpark._refresh) startSpark._refresh();
}

/* ============================ version check ============================ */
async function checkVersion(){
  try{
    const res=await fetch(CONFIG.versionUrl,{cache:'no-store'}); if(!res.ok) throw 0;
    const data=await res.json(); if(!data||!data.version) return;
    CURRENT_VER=String(data.version); if(data.url) CONFIG.downloadUrl=data.url;
    APP_READY = data.ready===true;      // only true when you've published the app
    buildApp();
    const seen=localStorage.getItem('pd_seen_ver');
    if(APP_READY && seen && cmpVer(CURRENT_VER,seen)>0) showUpdate();
  }catch(e){}
}
let toastTimer;
function toast(msg){
  const el=$('#toast'); $('#toastMsg').textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3400);
}
function cmpVer(a,b){const pa=String(a).split('.').map(Number),pb=String(b).split('.').map(Number);for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pa[i]||0)-(pb[i]||0);if(d)return d>0?1:-1;}return 0;}
function showUpdate(){
  const L=t();
  $('#ubTitle').textContent=L.update_title; $('#ubText').textContent=withVer(L.update_text); $('#ubDl').textContent=L.update_btn;
  $('#ubDl').onclick=()=>{localStorage.setItem('pd_seen_ver',CURRENT_VER);window.open(CONFIG.downloadUrl,'_blank');hideUpdate();};
  $('#ubX').onclick=()=>{localStorage.setItem('pd_seen_ver',CURRENT_VER);hideUpdate();};
  setTimeout(()=>$('#updateBanner').classList.add('show'),800);
}
function hideUpdate(){ $('#updateBanner').classList.remove('show'); }
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href],button'); if(!a) return;
  if(a.classList.contains('is-soon')){ e.preventDefault(); toast(t().soon_toast); return; }
  const href=a.getAttribute('href')||'';
  if(href===CONFIG.downloadUrl||a.id==='mainDl'||a.id==='navDl') localStorage.setItem('pd_seen_ver',CURRENT_VER);
});

/* ============================ global ============================ */
function wireGlobal(){
  const nav=$('#nav'), bar=$('#scrollbar');
  const onScroll=()=>{ nav.classList.toggle('scrolled',scrollY>20);
    const h=document.documentElement.scrollHeight-innerHeight; bar.style.width=(h>0?(scrollY/h*100):0)+'%'; };
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  $('#lang').addEventListener('click',()=>{LANG=LANG==='en'?'ar':'en';applyLang();});
  $('#lang').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();LANG=LANG==='en'?'ar':'en';applyLang();}});
  $('#themeBtn').addEventListener('click',()=>{THEME=THEME==='dark'?'light':'dark';applyTheme();});
}

/* ============================ boot ============================ */
document.documentElement.setAttribute('data-theme',THEME);
document.documentElement.dir=I18N[LANG].dir;
document.documentElement.lang=LANG;
document.documentElement.style.setProperty('--font',I18N[LANG].font);
wireGlobal(); applyTheme(); applyLang(); initCursor();

checkVersion();
</script>
